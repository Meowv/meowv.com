<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>方案 1 视觉对照</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        background: #e9eeeb;
        color: #18211b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: 1440px;
        min-height: 810px;
        padding: 18px 20px 22px;
      }

      h1 {
        margin: 0 0 14px;
        font-size: 20px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-bottom: 16px;
      }

      .card {
        overflow: hidden;
        border: 1px solid #cfd8d2;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 4px 14px rgb(20 35 25 / 8%);
      }

      .label {
        display: flex;
        height: 36px;
        align-items: center;
        padding: 0 12px;
        border-bottom: 1px solid #e2e7e3;
        font-size: 13px;
        font-weight: 700;
      }

      .frame {
        height: 396px;
        overflow: hidden;
        background: #fff;
      }

      .frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top left;
      }

      .focus {
        height: 205px;
        overflow: hidden;
      }

      .focus img {
        display: block;
        width: 100%;
        height: auto;
      }

      .note {
        margin: 2px 0 0;
        color: #607068;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>方案 1 视觉对照 · 同一预算工作簿状态</h1>
      <section class="row">
        <div class="card">
          <div class="label">设计源 · 顶部 810 px</div>
          <div class="frame"><img src="./reference-source.png" alt="方案 1 设计源" /></div>
        </div>
        <div class="card">
          <div class="label">实现 · 1440×810 浏览器实拍</div>
          <div class="frame">
            <img src="./editor-final-visible-1440x810.png" alt="在线 Excel 处理实现" />
          </div>
        </div>
      </section>
      <section class="row">
        <div class="card">
          <div class="label">设计源 · 编辑器上半区</div>
          <div class="focus"><img src="./reference-source.png" alt="" /></div>
        </div>
        <div class="card">
          <div class="label">实现 · 编辑器上半区</div>
          <div class="focus"><img src="./editor-final-visible-1440x810.png" alt="" /></div>
        </div>
      </section>
      <p class="note">
        对照重点：品牌栏、菜单与工具栏、公式栏、网格密度、绿色强调色、预算示例数据和状态栏。
      </p>
    </main>
  </body>
</html>
