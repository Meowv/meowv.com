<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼图游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #eaeaea;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .game-wrapper {
    background: #fff; padding: 24px; border-radius: 10px;
    box-shadow: 0 15px 35px rgba(50,50,93,.1), 0 5px 15px rgba(0,0,0,.07);
    text-align: center;
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 4px 12px; color: #34495e;
  }
  .header h1 { font-size: 20px; color: #5a9600; }
  .header .info { font-size: 14px; color: #525f7f; }
  .header .info span { color: #5a9600; font-weight: bold; }
  #puzzleCanvas {
    display: block; background: #f0f0f0; border-radius: 8px;
    cursor: pointer; touch-action: none;
    width: 400px; height: 400px;
  }
  .controls {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 12px; color: #525f7f; font-size: 13px; flex-wrap: wrap; gap: 8px;
  }
  .controls button {
    background: #5a9600; color: #fff; border: none;
    padding: 8px 20px; border-radius: 30px; cursor: pointer;
    font-size: 14px; transition: background 0.2s;
  }
  .controls button:hover { background: #4a7d00; }
  .controls .size-select {
    background: #f5f5f5; color: #34495e; border: 1px solid #ddd;
    border-radius: 6px; padding: 6px 10px; font-size: 13px; outline: none;
  }
  .controls .status { color: #5a9600; font-weight: bold; }
  @media (max-width: 460px) {
    .game-wrapper { padding: 14px; }
    #puzzleCanvas { width: 300px; height: 300px; }
    .header h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="header">
    <h1>🧩 拼图游戏</h1>
    <div class="info">步数: <span id="moveCount">0</span></div>
  </div>
  <canvas id="puzzleCanvas" width="400" height="400"></canvas>
  <div class="controls">
    <div><span class="status" id="status">点击方块移动</span></div>
    <div style="display:flex;gap:8px;align-items:center;">
      <select class="size-select" id="sizeSelect">
        <option value="3">3×3</option>
        <option value="4" selected>4×4</option>
        <option value="5">5×5</option>
      </select>
      <button id="shuffleBtn">打乱</button>
    </div>
  </div>
</div>
<script>
(function() {
  var canvas = document.getElementById('puzzleCanvas');
  var ctx = canvas.getContext('2d');
  var statusEl = document.getElementById('status');
  var moveCountEl = document.getElementById('moveCount');
  var size = 4;
  var tiles = [];
  var emptyIndex = size * size - 1;
  var moves = 0;
  var isShuffling = false;
  var animating = false;

  var COLORS = ['#e94560','#533483','#0f3460','#ffd700','#00bcd4','#ff6b6b','#4caf50','#ff9800','#9c27b0','#607d8b','#e91e63','#3f51b5','#009688','#ff5722','#795548','#8bc34a'];

  function init(newSize) {
    size = newSize || size;
    canvas.width = 400;
    canvas.height = 400;
    var total = size * size;
    tiles = [];
    for (var i = 0; i < total; i++) tiles.push(i);
    emptyIndex = total - 1;
    tiles[emptyIndex] = -1;
    moves = 0;
    moveCountEl.textContent = '0';
    isShuffling = true;
    shuffle(100);
  }

  function shuffle(times) {
    var count = 0;
    function doShuffle() {
      var neighbors = getNeighbors(emptyIndex);
      var rand = neighbors[Math.floor(Math.random() * neighbors.length)];
      swap(emptyIndex, rand);
      count++;
      if (count < times) {
        setTimeout(doShuffle, 5);
      } else {
        moves = 0;
        moveCountEl.textContent = '0';
        isShuffling = false;
        if (!isSolvable()) shuffle(times);
        else { draw(); statusEl.textContent = '开始拼图！'; }
      }
    }
    doShuffle();
  }

  function getNeighbors(idx) {
    var row = Math.floor(idx / size);
    var col = idx % size;
    var result = [];
    if (row > 0) result.push(idx - size);
    if (row < size - 1) result.push(idx + size);
    if (col > 0) result.push(idx - 1);
    if (col < size - 1) result.push(idx + 1);
    return result;
  }

  function swap(i, j) {
    var temp = tiles[i];
    tiles[i] = tiles[j];
    tiles[j] = temp;
    if (tiles[i] === -1) emptyIndex = i;
    else if (tiles[j] === -1) emptyIndex = j;
  }

  function isSolvable() {
    var flat = tiles.filter(function(t) { return t !== -1; });
    var inversions = 0;
    for (var i = 0; i < flat.length; i++) {
      for (var j = i + 1; j < flat.length; j++) {
        if (flat[i] > flat[j]) inversions++;
      }
    }
    if (size % 2 === 1) return inversions % 2 === 0;
    var emptyRow = Math.floor(emptyIndex / size);
    return (inversions + size - 1 - emptyRow) % 2 === 0;
  }

  function isSolved() {
    for (var i = 0; i < tiles.length - 1; i++) {
      if (tiles[i] !== i) return false;
    }
    return tiles[tiles.length - 1] === -1;
  }

  function draw() {
    var cellSize = 400 / size;
    ctx.clearRect(0, 0, 400, 400);

    for (var i = 0; i < tiles.length; i++) {
      var row = Math.floor(i / size);
      var col = i % size;
      var x = col * cellSize;
      var y = row * cellSize;

      if (tiles[i] === -1) {
        ctx.fillStyle = '#f0f0f0';
        ctx.fillRect(x, y, cellSize, cellSize);
        continue;
      }

      var colorIdx = tiles[i] % COLORS.length;
      ctx.fillStyle = COLORS[colorIdx];
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 4;
      ctx.fillRect(x + 2, y + 2, cellSize - 4, cellSize - 4);
      ctx.shadowBlur = 0;

      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = 'bold ' + (cellSize * 0.4) + 'px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(tiles[i] + 1, x + cellSize / 2, y + cellSize / 2);

      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 1;
      ctx.strokeRect(x + 2, y + 2, cellSize - 4, cellSize - 4);
    }
  }

  function tryMove(index) {
    if (isShuffling || animating || isSolved()) return false;
    var neighbors = getNeighbors(emptyIndex);
    if (neighbors.indexOf(index) === -1) return false;
    swap(emptyIndex, index);
    moves++;
    moveCountEl.textContent = moves;
    draw();
    if (isSolved()) {
      statusEl.textContent = '🎉 恭喜完成！共 ' + moves + ' 步';
    } else {
      statusEl.textContent = '继续拼图';
    }
    return true;
  }

  function getTileIndex(clientX, clientY) {
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    var mx = (clientX - rect.left) * scaleX;
    var my = (clientY - rect.top) * scaleY;
    var col = Math.floor(mx / (400 / size));
    var row = Math.floor(my / (400 / size));
    if (col < 0 || col >= size || row < 0 || row >= size) return -1;
    return row * size + col;
  }

  canvas.addEventListener('click', function(e) {
    var idx = getTileIndex(e.clientX, e.clientY);
    if (idx >= 0) tryMove(idx);
  });

  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var touch = e.touches[0];
    var idx = getTileIndex(touch.clientX, touch.clientY);
    if (idx >= 0) tryMove(idx);
  }, {passive: false});

  document.getElementById('sizeSelect').addEventListener('change', function() {
    init(parseInt(this.value));
  });

  document.getElementById('shuffleBtn').addEventListener('click', function() {
    init(size);
  });

  init(4);
})();
</script>
</body>
</html>
