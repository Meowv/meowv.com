<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五子棋</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #eaeaea;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .game-wrapper {
    background: #fff; padding: 24px; border-radius: 16px;
    box-shadow: 0 15px 35px rgba(50,50,93,.1), 0 5px 15px rgba(0,0,0,.07);
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 4px 12px; color: #34495e;
  }
  .header h1 { font-size: 20px; color: #5a9600; }
  .header .info { font-size: 14px; color: #525f7f; }
  .header .info span { color: #5a9600; font-weight: bold; }
  canvas {
    display: block; background: #d4a76a; border-radius: 8px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
    cursor: pointer;
  }
  .controls {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 12px; color: #525f7f; font-size: 13px; flex-wrap: wrap; gap: 8px;
  }
  .controls button {
    background: #5a9600; color: #fff; border: none;
    padding: 8px 20px; border-radius: 30px; cursor: pointer;
    font-size: 14px; transition: background 0.2s;
  }
  .controls button:hover { background: #4a7d00; }
  .controls button.secondary { background: #42b983; }
  .controls button.secondary:hover { background: #368b6a; }
  .controls .status { color: #5a9600; font-weight: bold; }
  @media (max-width: 460px) {
    .game-wrapper { padding: 14px; }
    canvas { width: 300px; height: 300px; }
    .header h1 { font-size: 16px; }
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="header">
    <h1>⚫ 五子棋</h1>
    <div class="info">回合: <span id="turnDisplay">黑棋</span></div>
  </div>
  <canvas id="gameCanvas" width="540" height="540"></canvas>
  <div class="controls">
    <div><span class="status" id="status">黑棋先手</span></div>
    <div style="display:flex;gap:8px;">
      <button class="secondary" id="undoBtn">悔棋</button>
      <button id="restartBtn">重新开始</button>
    </div>
  </div>
</div>
<script>
(function() {
  var SIZE = 540;
  var GRID = 15;
  var CELL = SIZE / GRID;
  var RADIUS = CELL * 0.42;
  var OFFSET = CELL / 2;

  var canvas = document.getElementById('gameCanvas');
  var ctx = canvas.getContext('2d');
  var statusEl = document.getElementById('status');
  var turnDisplay = document.getElementById('turnDisplay');

  var board = [];
  var currentPlayer = 1;
  var gameOver = false;
  var history = [];

  function init() {
    board = [];
    for (var i = 0; i < GRID; i++) {
      board[i] = [];
      for (var j = 0; j < GRID; j++) {
        board[i][j] = 0;
      }
    }
    currentPlayer = 1;
    gameOver = false;
    history = [];
    statusEl.textContent = '黑棋先手';
    turnDisplay.textContent = '黑棋';
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, SIZE, SIZE);

    ctx.strokeStyle = '#8b6914';
    ctx.lineWidth = 1;
    for (var i = 0; i < GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(OFFSET, i * CELL + OFFSET);
      ctx.lineTo(SIZE - OFFSET, i * CELL + OFFSET);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(i * CELL + OFFSET, OFFSET);
      ctx.lineTo(i * CELL + OFFSET, SIZE - OFFSET);
      ctx.stroke();
    }

    var starPoints = [[3,3],[3,7],[3,11],[7,3],[7,7],[7,11],[11,3],[11,7],[11,11]];
    ctx.fillStyle = '#8b6914';
    starPoints.forEach(function(p) {
      ctx.beginPath();
      ctx.arc(p[0] * CELL + OFFSET, p[1] * CELL + OFFSET, 4, 0, Math.PI * 2);
      ctx.fill();
    });

    for (var y = 0; y < GRID; y++) {
      for (var x = 0; x < GRID; x++) {
        if (board[y][x] === 0) continue;
        var cx = x * CELL + OFFSET;
        var cy = y * CELL + OFFSET;
        var gradient = ctx.createRadialGradient(cx - 3, cy - 3, 2, cx, cy, RADIUS);
        if (board[y][x] === 1) {
          gradient.addColorStop(0, '#555');
          gradient.addColorStop(1, '#111');
        } else {
          gradient.addColorStop(0, '#fff');
          gradient.addColorStop(1, '#ccc');
        }
        ctx.beginPath();
        ctx.arc(cx, cy, RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
        ctx.strokeStyle = board[y][x] === 1 ? '#000' : '#bbb';
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }

    if (history.length > 0) {
      var last = history[history.length - 1];
      var lx = last.x * CELL + OFFSET;
      var ly = last.y * CELL + OFFSET;
      ctx.strokeStyle = '#5a9600';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(lx - 6, ly - 6);
      ctx.lineTo(lx + 6, ly + 6);
      ctx.moveTo(lx + 6, ly - 6);
      ctx.lineTo(lx - 6, ly + 6);
      ctx.stroke();
    }
  }

  function checkWin(row, col, player) {
    var directions = [[1,0],[0,1],[1,1],[1,-1]];
    for (var d = 0; d < directions.length; d++) {
      var dx = directions[d][0];
      var dy = directions[d][1];
      var count = 1;
      for (var dir = -1; dir <= 1; dir += 2) {
        for (var step = 1; step < 5; step++) {
          var nx = col + dx * step * dir;
          var ny = row + dy * step * dir;
          if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) break;
          if (board[ny][nx] === player) count++; else break;
        }
      }
      if (count >= 5) return true;
    }
    return false;
  }

  function evaluateBoard(player) {
    var score = 0;
    var directions = [[1,0],[0,1],[1,1],[1,-1]];
    for (var y = 0; y < GRID; y++) {
      for (var x = 0; x < GRID; x++) {
        if (board[y][x] !== 0) continue;
        for (var d = 0; d < directions.length; d++) {
          var dx = directions[d][0];
          var dy = directions[d][1];
          var playerCount = 0;
          var emptyCount = 0;
          var blocked = false;
          for (var step = 1; step <= 4; step++) {
            var nx = x - dx * step;
            var ny = y - dy * step;
            if (nx < 0 || nx >= GRID || ny < 0 || ny >= GRID) { blocked = true; break; }
            if (board[ny][nx] === player) playerCount++;
            else if (board[ny][nx] === 0) emptyCount++;
            else { blocked = true; break; }
          }
          if (!blocked && playerCount > 0) {
            if (playerCount === 4) score += 10000;
            else if (playerCount === 3 && emptyCount >= 1) score += 1000;
            else if (playerCount === 2) score += 100;
            else if (playerCount === 1) score += 10;
          }
          playerCount = 0; emptyCount = 0; blocked = false;
          for (var step2 = 1; step2 <= 4; step2++) {
            var nx2 = x + dx * step2;
            var ny2 = y + dy * step2;
            if (nx2 < 0 || nx2 >= GRID || ny2 < 0 || ny2 >= GRID) { blocked = true; break; }
            if (board[ny2][nx2] === player) playerCount++;
            else if (board[ny2][nx2] === 0) emptyCount++;
            else { blocked = true; break; }
          }
          if (!blocked && playerCount > 0) {
            if (playerCount === 4) score += 10000;
            else if (playerCount === 3 && emptyCount >= 1) score += 1000;
            else if (playerCount === 2) score += 100;
            else if (playerCount === 1) score += 10;
          }
        }
      }
    }
    return score;
  }

  function aiMove() {
    var bestScore = -Infinity;
    var bestMove = null;
    for (var y = 0; y < GRID; y++) {
      for (var x = 0; x < GRID; x++) {
        if (board[y][x] !== 0) continue;
        var hasNeighbor = false;
        for (var dy = -2; dy <= 2; dy++) {
          for (var dx = -2; dx <= 2; dx++) {
            if (dx === 0 && dy === 0) continue;
            var nx2 = x + dx, ny2 = y + dy;
            if (nx2 >= 0 && nx2 < GRID && ny2 >= 0 && ny2 < GRID && board[ny2][nx2] !== 0) hasNeighbor = true;
          }
        }
        if (!hasNeighbor) continue;

        board[y][x] = 2;
        var attackScore = evaluateBoard(2);
        board[y][x] = 1;
        var defenseScore = evaluateBoard(1);
        board[y][x] = 0;

        var score = attackScore * 1.1 + defenseScore;
        if (score > bestScore) {
          bestScore = score;
          bestMove = {x: x, y: y};
        }
      }
    }
    if (!bestMove) {
      if (board[7][7] === 0) bestMove = {x: 7, y: 7};
      else {
        for (var yy = 0; yy < GRID; yy++) {
          for (var xx = 0; xx < GRID; xx++) {
            if (board[yy][xx] === 0) { bestMove = {x: xx, y: yy}; break; }
          }
          if (bestMove) break;
        }
      }
    }
    return bestMove;
  }

  function placePiece(row, col, player) {
    board[row][col] = player;
    history.push({x: col, y: row, player: player});
    draw();
    if (checkWin(row, col, player)) {
      gameOver = true;
      statusEl.textContent = player === 1 ? '🎉 黑棋获胜！' : '🤖 白棋(AI)获胜！';
      turnDisplay.textContent = '游戏结束';
      return true;
    }
    var isDraw = true;
    for (var y = 0; y < GRID; y++) {
      for (var x = 0; x < GRID; x++) {
        if (board[y][x] === 0) { isDraw = false; break; }
      }
      if (!isDraw) break;
    }
    if (isDraw) {
      gameOver = true;
      statusEl.textContent = '🤝 平局！';
      turnDisplay.textContent = '游戏结束';
      return true;
    }
    return false;
  }

  function handleClick(e) {
    if (gameOver) return;
    if (currentPlayer === 2) return;

    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    var mx = (e.clientX - rect.left) * scaleX;
    var my = (e.clientY - rect.top) * scaleY;
    var col = Math.round((mx - OFFSET) / CELL);
    var row = Math.round((my - OFFSET) / CELL);

    if (col < 0 || col >= GRID || row < 0 || row >= GRID) return;
    if (board[row][col] !== 0) return;

    if (placePiece(row, col, 1)) return;
    currentPlayer = 2;
    turnDisplay.textContent = '白棋(AI)';
    statusEl.textContent = 'AI 思考中...';

    setTimeout(function() {
      var move = aiMove();
      if (move) {
        placePiece(move.y, move.x, 2);
        if (!gameOver) {
          currentPlayer = 1;
          turnDisplay.textContent = '黑棋';
          statusEl.textContent = '轮到你';
        }
      }
    }, 200);
  }

  canvas.addEventListener('click', handleClick);

  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    var touch = e.touches[0];
    var rect = canvas.getBoundingClientRect();
    var scaleX = canvas.width / rect.width;
    var scaleY = canvas.height / rect.height;
    var mx = (touch.clientX - rect.left) * scaleX;
    var my = (touch.clientY - rect.top) * scaleY;
    var col = Math.round((mx - OFFSET) / CELL);
    var row = Math.round((my - OFFSET) / CELL);
    if (col < 0 || col >= GRID || row < 0 || row >= GRID) return;
    if (gameOver || currentPlayer !== 1 || board[row][col] !== 0) return;
    if (placePiece(row, col, 1)) return;
    currentPlayer = 2;
    turnDisplay.textContent = '白棋(AI)';
    statusEl.textContent = 'AI 思考中...';
    setTimeout(function() {
      var move = aiMove();
      if (move) {
        placePiece(move.y, move.x, 2);
        if (!gameOver) {
          currentPlayer = 1;
          turnDisplay.textContent = '黑棋';
          statusEl.textContent = '轮到你';
        }
      }
    }, 200);
  }, {passive: false});

  document.getElementById('restartBtn').addEventListener('click', function() {
    init();
  });

  document.getElementById('undoBtn').addEventListener('click', function() {
    if (gameOver) { init(); return; }
    if (history.length < 2) { alert('没有可悔的棋'); return; }
    var last = history.pop();
    board[last.y][last.x] = 0;
    last = history.pop();
    board[last.y][last.x] = 0;
    currentPlayer = 1;
    turnDisplay.textContent = '黑棋';
    statusEl.textContent = '已悔棋';
    draw();
  });

  canvas.setAttribute('width', SIZE);
  canvas.setAttribute('height', SIZE);
  init();
})();
</script>
</body>
</html>
