<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; font-family: Arial, sans-serif;
  }
  .game-wrapper {
    background: #0f3460;
    padding: 20px; border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 0 4px 16px; color: #e94560;
  }
  .header h1 { font-size: 22px; text-shadow: 0 0 10px rgba(233,69,96,0.5); }
  .score-box { text-align: right; color: #eee; }
  .score-box span { font-size: 24px; font-weight: bold; color: #ffd700; }
  canvas {
    display: block; background: #1a1a2e; border-radius: 8px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
    width: 400px; height: 400px;
  }
  .controls {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 12px; color: #aaa; font-size: 13px;
  }
  .controls button {
    background: #e94560; color: #fff; border: none;
    padding: 8px 20px; border-radius: 8px; cursor: pointer;
    font-size: 14px; transition: background 0.2s;
  }
  .controls button:hover { background: #c73650; }
  .status { color: #ffd700; font-weight: bold; }
  .mobile-dpad {
    display: none; flex-direction: column; align-items: center;
    gap: 4px; margin-top: 16px;
  }
  .mobile-dpad .row { display: flex; gap: 4px; }
  .mobile-dpad button {
    width: 56px; height: 56px; background: rgba(233,69,96,0.3);
    border: 2px solid rgba(233,69,96,0.6); border-radius: 12px;
    color: #fff; font-size: 24px; cursor: pointer; user-select: none;
    transition: background 0.15s; display: flex; align-items: center; justify-content: center;
  }
  .mobile-dpad button:active { background: rgba(233,69,96,0.7); }
  .mobile-dpad .spacer { width: 56px; height: 56px; }
  @media (pointer: coarse) {
    .mobile-dpad { display: flex; }
    .controls { flex-wrap: wrap; gap: 8px; justify-content: center; }
  }
  @media (max-width: 460px) {
    .game-wrapper { padding: 12px; border-radius: 10px; }
    canvas { width: 300px; height: 300px; }
    .header h1 { font-size: 18px; }
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="header">
    <h1>🐍 贪吃蛇</h1>
    <div class="score-box">分数 <span id="score">0</span></div>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div class="controls">
    <div><span class="status" id="status">▶ 按方向键开始</span></div>
    <button id="restartBtn">重新开始</button>
  </div>
  <div class="mobile-dpad">
    <div class="row"><div class="spacer"></div><button data-dir="up">↑</button><div class="spacer"></div></div>
    <div class="row"><button data-dir="left">←</button><button data-dir="down">↓</button><button data-dir="right">→</button></div>
  </div>
</div>
<script>
(function() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const statusEl = document.getElementById('status');
  const restartBtn = document.getElementById('restartBtn');
  const SIZE = 400;
  const GRID = 20;
  const CELL = SIZE / GRID;

  let snake, food, direction, nextDirection, score, gameLoop, gameOver;
  let speed = 150;

  function init() {
    snake = [
      {x: 10, y: 10},
      {x: 9, y: 10},
      {x: 8, y: 10}
    ];
    direction = {x: 1, y: 0};
    nextDirection = {x: 1, y: 0};
    score = 0;
    gameOver = false;
    scoreEl.textContent = '0';
    statusEl.textContent = '▶ 按方向键开始';
    spawnFood();
    draw();
  }

  function spawnFood() {
    const total = GRID * GRID;
    if (snake.length >= total) {
      food = null;
      return;
    }
    const occupied = new Set(snake.map(c => `${c.x},${c.y}`));
    const free = [];
    for (let i = 0; i < total; i++) {
      const x = i % GRID, y = Math.floor(i / GRID);
      if (!occupied.has(`${x},${y}`)) free.push({x, y});
    }
    food = free[Math.floor(Math.random() * free.length)];
  }

  function draw() {
    ctx.clearRect(0, 0, SIZE, SIZE);
    ctx.shadowBlur = 0;

    for (let i = 0; i < snake.length; i++) {
      const {x, y} = snake[i];
      const posX = x * CELL + 1, posY = y * CELL + 1;
      const w = CELL - 2;
      if (i === 0) {
        ctx.fillStyle = '#e94560';
        ctx.shadowColor = '#e94560';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.roundRect(posX, posY, w, w, 4);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        const eyeOff = 5, eyeR = 3;
        if (direction.x === 1) {
          ctx.arc(posX + w - 5, posY + 5, eyeR, 0, Math.PI * 2);
          ctx.arc(posX + w - 5, posY + w - 5, eyeR, 0, Math.PI * 2);
        } else if (direction.x === -1) {
          ctx.arc(posX + 5, posY + 5, eyeR, 0, Math.PI * 2);
          ctx.arc(posX + 5, posY + w - 5, eyeR, 0, Math.PI * 2);
        } else if (direction.y === -1) {
          ctx.arc(posX + 5, posY + 5, eyeR, 0, Math.PI * 2);
          ctx.arc(posX + w - 5, posY + 5, eyeR, 0, Math.PI * 2);
        } else {
          ctx.arc(posX + 5, posY + w - 5, eyeR, 0, Math.PI * 2);
          ctx.arc(posX + w - 5, posY + w - 5, eyeR, 0, Math.PI * 2);
        }
        ctx.fill();
      } else {
        const t = i / snake.length;
        ctx.fillStyle = `rgb(${Math.floor(46 + t * 20)}, ${Math.floor(204 + t * 30)}, ${Math.floor(113 + t * 20)})`;
        ctx.beginPath();
        ctx.roundRect(posX, posY, w, w, 3);
        ctx.fill();
      }
    }

    if (food) {
      ctx.shadowColor = '#ffd700';
      ctx.shadowBlur = 15;
      ctx.fillStyle = '#ffd700';
      ctx.beginPath();
      ctx.arc(food.x * CELL + CELL/2, food.y * CELL + CELL/2, CELL/2 - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 0.5;
    for (let i = 0; i <= GRID; i++) {
      ctx.beginPath();
      ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, SIZE); ctx.stroke();
      ctx.moveTo(0, i * CELL); ctx.lineTo(SIZE, i * CELL); ctx.stroke();
    }
  }

  function update() {
    direction = {...nextDirection};
    const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID) {
      endGame('撞墙了...');
      return;
    }

    for (let i = 0; i < snake.length; i++) {
      if (head.x === snake[i].x && head.y === snake[i].y) {
        endGame('咬到自己了...');
        return;
      }
    }

    snake.unshift(head);

    if (food && head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      spawnFood();
      if (!food) {
        endGame('🎉 你赢了！');
        return;
      }
      if (speed > 60) speed -= 2;
    } else {
      snake.pop();
    }

    draw();
  }

  function endGame(msg) {
    gameOver = true;
    clearInterval(gameLoop);
    statusEl.textContent = `💀 ${msg} 得分: ${score}`;
  }

  function start() {
    if (gameLoop) clearInterval(gameLoop);
    if (!gameOver) {
      statusEl.textContent = '▶ 游戏中';
    }
    gameLoop = setInterval(update, speed);
  }

  function reset() {
    clearInterval(gameLoop);
    speed = 150;
    init();
  }

  function setDirection(dx, dy) {
    if (gameOver) return;
    if (dx === -direction.x && dy === -direction.y) return;
    if (dx === direction.x && dy === direction.y) return;
    nextDirection = {x: dx, y: dy};
    if (!gameLoop && !gameOver) {
      statusEl.textContent = '▶ 游戏中';
      start();
    }
  }

  document.addEventListener('keydown', e => {
    const map = {
      ArrowUp: [0, -1], ArrowDown: [0, 1],
      ArrowLeft: [-1, 0], ArrowRight: [1, 0],
      w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0]
    };
    if (map[e.key]) {
      e.preventDefault();
      setDirection(map[e.key][0], map[e.key][1]);
    }
  });

  document.querySelectorAll('[data-dir]').forEach(btn => {
    btn.addEventListener('click', () => {
      const map = {up: [0,-1], down: [0,1], left: [-1,0], right: [1,0]};
      const d = map[btn.dataset.dir];
      if (d) setDirection(d[0], d[1]);
    });
  });

  restartBtn.addEventListener('click', reset);

  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStartX = t.clientX; touchStartY = t.clientY;
  }, {passive: true});
  canvas.addEventListener('touchmove', e => e.preventDefault(), {passive: false});
  canvas.addEventListener('touchend', e => {
    const rect = canvas.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    if (!touchStartX) return;
    const dx = touchStartX - cx, dy = touchStartY - cy;
    touchStartX = 0;
    if (Math.abs(dx) > Math.abs(dy)) {
      setDirection(dx < 0 ? 1 : -1, 0);
    } else {
      setDirection(0, dy < 0 ? 1 : -1);
    }
  }, {passive: true});

  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (r > w / 2) r = w / 2;
      if (r > h / 2) r = h / 2;
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r);
      this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r);
      this.arcTo(x, y, x + w, y, r);
      this.closePath();
      return this;
    };
  }

  init();
})();
</script>
</body>
</html>
